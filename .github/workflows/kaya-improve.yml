name: Kaya Improve checks
on:
  push:
    branches: [main, feat/kaya-improve-monitor]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sh scripts/test-kaya-improve.sh
      - run: npx tsc --noEmit
      - run: node scripts/kaya-backup.mjs check
